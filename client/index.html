<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/books.css">
    <link rel="stylesheet" href="css/authors.css">
    <link rel="stylesheet" href="css/borrowers.css">
    <link rel="stylesheet" href="css/loans.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- View Switcher -->
    <header class="header">
        <button id="books-btn" class="view-toggle">
            <h2 class="biew-toggle-icon">📖</h2>
            <h2 class="vew-toggle-tittle">Books</h2>
        </button>
        <button id="authors-btn" class="view-toggle">
            <h2 class="biew-toggle-icon">✍️</h2>
            <h2 class="vew-toggle-tittle">Authors</h2>
        </button>
        <button id="borrowers-btn" class="view-toggle">
            <h2 class="biew-toggle-icon">🪪</h2>
            <h2 class="vew-toggle-tittle">Borrowers</h2>
        </button>
        <button id="loans-btn" class="view-toggle">
            <h2 class="biew-toggle-icon">🔖</h2>
            <h2 class="vew-toggle-tittle">Loans</h2>
        </button>
    </header>

    <main class="main-content">
        
        <!---------- BOOKS VIEW ---------->
        <section class="books-view">
            <div class="books-query-section">
                
                <div class="get-all-books-container">
                    <button id="get-all-books-btn">Get all books</button>
                    <button id="get-all-available-books-btn">Get all available books</button>
                </div>

                <div class="search-book-by-parameters-container">
                    <select name="search-book-parameter" id="search-book-parameter">
                        <option value="book-id">Id</option>
                        <option value="book-isbn">ISBN</option>
                        <option value="book-title">Title</option>
                    </select>
                    <input type="text" id="search-book-input" placeholder="Search by parameter">
                    <button id="search-book-by-paremeters-btn">Search</button>
                </div>

                <div class="filter-book-by-author-container">
                    <select id="book-by-author-filter">
                        <option value="" disabled selected hidden>All authors</option>
                    </select>
                    <button id="author-filter-btn">Search</button>
                </div>

                <content class="books-list-container">
                    <!-- <item class="book-item">
                        <h3 class="book-title">Cien años de soledad</h3>
                        <span class="book-author">Gabriel García Márquez</span>
                        <span class="book-isbn">978-0307474728</span>
                        <span class="book-year">1967</span>
                        <button type="button" class="delete-book-btn" disabled>🗑️</button>
                    </item> -->
                </content>
            </div>

            <div class="create-book-section">
                <h3 class="create-book-title">Create book</h3>

                <form class="create-book-form" id="create-book-form">

                    <div class="create-book-field">
                        <label class="create-book-label" for="create-book-title-input">Title</label>
                        <input type="text" id="create-book-title-input" placeholder="Book title">
                    </div>

                    <div class="create-book-field">
                        <label class="create-book-label" for="create-book-author">Author</label>
                        <select id="create-book-author" class="author-select">
                            <option value="" disabled selected hidden>Select an author</option>
                        </select>
                    </div>

                    <div class="create-book-field">
                        <span class="create-book-label">ISBN</span>
                        <div class="create-book-isbn-container">
                            <p id="create-book-isbn" class="create-book-isbn">Not generated</p>
                            <button type="button" id="generate-isbn-btn">Generate</button>
                        </div>
                    </div>

                    <div class="create-book-field">
                        <label class="create-book-label" for="create-book-year">Year</label>
                        <input type="number" id="create-book-year" placeholder="Publication year">
                    </div>

                    <button type="button" id="create-book-btn">Create book</button>
                </form>
            </div>
        </section>
        


        <!---------- AUTHORS VIEW ---------->
        <section class="authors-view">
            <div class="authors-query-section">
                <div class="get-all-authors-container">
                    <button id="get-all-authors-btn">Get all authors</button>
                </div>

                <div class="search-author-by-parameters-container">
                    <select name="search-author-parameter" id="search-author-parameter">
                        <option value="author-id">Id</option>
                        <option value="author-name">Name</option>
                    </select>
                    <input type="text" id="search-author-input" placeholder="Search by parameter">
                    <button id="search-author-by-paremeters-btn">Search</button>
                </div>

                <content class="authors-list-container">
                    <!-- <item class="author-item">
                        <h3 class="author-name">Gabriel García Márquez</h3>
                        <p class="author-nationality">Colombian</p>
                        <div class="author-actions">
                            <button type="button" class="get-author-books-btn" disabled>🗑️</button>
                            <button type="button" class="delete-author-btn" disabled>🗑️</button>
                        </div>
                    </item> -->
                </content>
            </div>

            <div class="create-author-section">
                
                <h3 class="create-author-title">Create author</h3>

                <form class="create-author-form" id="create-author-form">

                    <div class="create-author-field">
                        <label class="create-author-label" for="create-author-name-input">Name</label>
                        <input type="text" id="create-author-name-input" placeholder="Author name">
                    </div>

                    <div class="create-author-field">
                        <label class="create-author-label" for="create-author-nationality">Nationality</label>
                        <select id="create-author-nationality">
                            <option value="" disabled selected hidden>Select a nationality</option>
                            <option value="British">United Kingdom</option>
                            <option value="American">United States</option>
                            <option value="Spanish">Spain</option>
                            <option value="French">France</option>
                            <option value="Italian">Italy</option>
                            <option value="German">Germany</option>
                            <option value="Japanese">Japan</option>
                            <option value="Canadian">Canada</option>
                            <option value="Indian">India</option>
                            <option value="Australian">Australia</option>
                        </select>
                    </div>

                    <button type="button" id="create-author-btn">Create author</button>
                </form>

                <h3 class="author-books-list">Author's books</h3>
                <content class="author-books-list-container"></content>
        </section>



        <!---------- BORROWERS VIEW ---------->
        <section class="borrowers-view">
            <div class="borrowers-query-section">
                <div class="get-all-borrowers-container">
                    <button id="get-all-borrowers-btn">Get all borrowers</button>
                </div>

                <div class="search-borrower-by-parameters-container">
                    <select name="search-borrower-parameter" id="search-borrower-parameter">
                        <option value="borrower-id">Id</option>
                        <option value="borrower-name">Name</option>
                    </select>
                    <input type="text" id="search-borrower-input" placeholder="Search by parameter">
                    <button id="search-borrower-by-parameters-btn">Search</button>
                </div>

                <content class="borrowers-list-container">
                    <!--
                    <item class="borrower-item" data-borrower-id="1">
                        <h3 class="borrower-name">Ada Lovelace</h3>
                        <p class="borrower-email">ada@example.com</p>
                        <div class="borrower-actions">
                            <button type="button" class="get-borrower-loans-btn" disabled>📖</button>
                            <button type="button" class="delete-borrower-btn" disabled>🗑️</button>
                        </div>
                    </item>
                    -->
                </content>
            </div>

            <div class="create-borrower-section">
                <h3 class="create-borrower-title">Create borrower</h3>

                <form class="create-borrower-form" id="create-borrower-form">
                    <div class="create-borrower-field">
                        <label class="create-borrower-label" for="create-borrower-name-input">Name</label>
                        <input type="text" id="create-borrower-name-input" placeholder="Borrower name">
                    </div>

                    <div class="create-borrower-field">
                        <label class="create-borrower-label" for="create-borrower-email-input">Email</label>
                        <input type="email" id="create-borrower-email-input" placeholder="Borrower email">
                    </div>

                    <button type="button" id="create-borrower-btn">Create borrower</button>
                </form>

                <h3 class="borrower-loans-list">Borrower's loans</h3>
                <content class="borrower-loans-list-container"></content>
            </div>
        </section>
        <section class="loans-view">
            <div class="loans-query-section">
                <div class="loan-filter-buttons">
                    <button type="button" class="loan-filter-btn active" data-loan-filter="all">All loans</button>
                    <button type="button" class="loan-filter-btn" data-loan-filter="active">Active loans</button>
                    <button type="button" class="loan-filter-btn" data-loan-filter="returned">Returned loans</button>
                </div>

                <content class="loans-list-container"></content>
            </div>

            <div class="create-loan-section">
                <h3 class="create-loan-title">Loan a book</h3>

                <form class="create-loan-form" id="create-loan-form">
                    <div class="create-loan-field">
                        <label class="create-loan-label" for="loan-book-select">Book</label>
                        <select id="loan-book-select" required>
                            <option value="" disabled selected>Select a book</option>
                        </select>
                    </div>

                    <div class="create-loan-field">
                        <label class="create-loan-label" for="loan-borrower-select">Borrower</label>
                        <select id="loan-borrower-select" required>
                            <option value="" disabled selected>Select a borrower</option>
                        </select>
                    </div>

                    <div class="create-loan-field">
                        <label class="create-loan-label" for="loan-due-date">Due date</label>
                        <input type="date" id="loan-due-date" required>
                    </div>

                    <p class="loan-date-note">The loan start date is set automatically.</p>
                    <button type="button" id="create-loan-btn">Loan book</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/index.js"></script>
    <script type="module" src="js/views/books.js"></script>
    <script type="module" src="js/views/authors.js"></script>
    <script type="module" src="js/views/borrowers.js"></script>
    <script type="module" src="js/views/loans.js"></script>
</body>

</html>
